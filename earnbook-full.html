<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnBook - Solana SocialFi</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-x: hidden; }
    #root { width: 100%; min-height: 100vh; }
    .emoji-picker { position: absolute; background: rgba(30, 30, 40, 0.98); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 1rem; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-height: 250px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .emoji-picker span { font-size: 1.8rem; cursor: pointer; padding: 0.5rem; border-radius: 8px; text-align: center; transition: all 0.2s; }
    .emoji-picker span:hover { background: rgba(153, 69, 255, 0.3); transform: scale(1.2); }
    .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10000; background: rgba(15, 14, 19, 0.95); padding: 2rem 3rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #9945FF; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .gif-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; max-height: 300px; overflow-y: auto; margin-top: 1rem; }
    .gif-item { cursor: pointer; border-radius: 8px; overflow: hidden; transition: transform 0.2s; }
    .gif-item:hover { transform: scale(1.05); }
    .gif-item img { width: 100%; height: 100px; object-fit: cover; }
    input[type="checkbox"] { opacity: 0; width: 0; height: 0; }
    input:checked + .slider { background: linear-gradient(90deg, #14F195, #9945FF); }
    input:checked + .slider:before { transform: translateX(26px); }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: 0.4s; border-radius: 50%; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(153, 69, 255, 0.5); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(153, 69, 255, 0.7); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { Connection, PublicKey, LAMPORTS_PER_SOL, SystemProgram, Transaction } = solanaWeb3;

    const SUPABASE_URL = 'https://qqlfzfphpufcdeqcpbwy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxbGZ6ZnBocHVmY2RlcWNwYnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyNTk0MzcsImV4cCI6MjA3NjgzNTQzN30.w7HaN3RiQfoHEyP2rb0XwAG2aKeWy5CIw0ijOmDQ-Vg';
    const ADMIN_WALLET = '2rwYZWAexatehQ53dRLCcFvfff5sDt8Upfhr1h3Z7Fau';
    const ADMIN_FEE_PERCENT = 0.005;

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEMO_GIFS = [
      'https://media.giphy.com/media/3o7btPCcdNniyf0ArS/giphy.gif',
      'https://media.giphy.com/media/l0HlvtIPa3JyPVGfK/giphy.gif',
      'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif'
    ];

    function EarnBook() {
      const connection = new Connection('https://api.devnet.solana.com', 'confirmed');
      
      const [wallet, setWallet] = useState(null);
      const [balance, setBalance] = useState(0);
      const [currentUser, setCurrentUser] = useState(null);
      const [allUsers, setAllUsers] = useState([]);
      const [allPosts, setAllPosts] = useState([]);
      const [activeTab, setActiveTab] = useState('home');
      const [newPost, setNewPost] = useState('');
      const [selectedMedia, setSelectedMedia] = useState(null);
      const [mediaType, setMediaType] = useState(null);
      const [showSearchModal, setShowSearchModal] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [viewingProfile, setViewingProfile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [loadingMessage, setLoadingMessage] = useState('');
      const [showTipModal, setShowTipModal] = useState(false);
      const [tipAmount, setTipAmount] = useState('0.01');
      const [tippingPostId, setTippingPostId] = useState(null);
      const [showEmojiPicker, setShowEmojiPicker] = useState(null);
      const [commentText, setCommentText] = useState({});
      const [showComments, setShowComments] = useState({});
      const [showGifPicker, setShowGifPicker] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [showNotifications, setShowNotifications] = useState(false);
      const [theme, setTheme] = useState('dark');
      const [editingProfile, setEditingProfile] = useState(false);
      const [editUsername, setEditUsername] = useState('');
      const [editBio, setEditBio] = useState('');
      const [editPfp, setEditPfp] = useState('');
      const [chatWith, setChatWith] = useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const [showChatList, setShowChatList] = useState(false);
      const [allFollows, setAllFollows] = useState([]);
      const [siteSettings, setSiteSettings] = useState({ twitter_link: '', ca_text: '' });
      const [adminStats, setAdminStats] = useState({ totalUsers: 0, totalTips: 0 });
      const [editingSettings, setEditingSettings] = useState(false);
      const [newTwitterLink, setNewTwitterLink] = useState('');
      const [newCAText, setNewCAText] = useState('');

      const fileInputRef = useRef(null);
      const emojis = ['❤️', '😂', '😮', '😢', '🔥', '👍', '🎉', '💯', '😍', '🤔', '👏', '💪'];

      useEffect(() => {
        if (wallet) {
          loadUserData();
          loadAllUsers();
          loadPosts();
          loadNotifications();
          loadFollows();
          loadSiteSettings();
          if (wallet === ADMIN_WALLET) loadAdminStats();
        }
      }, [wallet]);

      useEffect(() => {
        if (chatWith) loadChatMessages();
      }, [chatWith]);

      const loadSiteSettings = async () => {
        try {
          const { data } = await supabase.from('site_settings').select('*').limit(1);
          if (data && data.length > 0) setSiteSettings(data[0]);
        } catch (err) {
          console.error('Settings load error:', err);
        }
      };

      const loadUserData = async () => {
        try {
          const { data: user } = await supabase.from('users').select('*').eq('wallet', wallet).maybeSingle();
          if (user) {
            setCurrentUser(user);
          } else {
            const newUser = {
              wallet,
              username: `user${Date.now()}`,
              bio: 'New to EarnBook 🚀',
              profile_pic: '👤',
              pending_sol: 0,
              total_earnings: 0
            };
            const { data: created } = await supabase.from('users').insert([newUser]).select().single();
            setCurrentUser(created);
          }
        } catch (err) {
          console.error('User load error:', err);
        }
      };

      const loadAllUsers = async () => {
        try {
          const { data } = await supabase.from('users').select('*');
          setAllUsers(data || []);
        } catch (err) {
          console.error('Users load error:', err);
        }
      };

      const loadPosts = async () => {
        try {
          const { data } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
          setAllPosts(data || []);
        } catch (err) {
          console.error('Posts load error:', err);
        }
      };

      const loadNotifications = async () => {
        try {
          const { data } = await supabase.from('notifications').select('*').eq('user_wallet', wallet).order('created_at', { ascending: false }).limit(50);
          setNotifications(data || []);
        } catch (err) {
          console.error('Notifications load error:', err);
        }
      };

      const loadFollows = async () => {
        try {
          const { data } = await supabase.from('follows').select('*');
          setAllFollows(data || []);
        } catch (err) {
          console.error('Follows load error:', err);
        }
      };

      const loadChatMessages = async () => {
        try {
          const { data } = await supabase.from('messages').select('*').or(`and(from_wallet.eq.${wallet},to_wallet.eq.${chatWith}),and(from_wallet.eq.${chatWith},to_wallet.eq.${wallet})`).order('created_at', { ascending: true });
          setChatMessages(data || []);
        } catch (err) {
          console.error('Chat load error:', err);
        }
      };

      const loadAdminStats = async () => {
        try {
          const { data: users } = await supabase.from('users').select('*');
          const { data: posts } = await supabase.from('posts').select('tips');
          const totalTips = posts?.reduce((sum, post) => sum + (post.tips || 0), 0) || 0;
          setAdminStats({ totalUsers: users?.length || 0, totalTips });
        } catch (err) {
          console.error('Admin stats error:', err);
        }
      };

      const connectWallet = async () => {
        try {
          setLoading(true);
          setLoadingMessage('Connecting wallet...');
          if (!window.phantom?.solana) {
            alert('Please install Phantom wallet!');
            window.open('https://phantom.app/', '_blank');
            setLoading(false);
            return;
          }
          const resp = await window.phantom.solana.connect();
          const publicKey = resp.publicKey.toString();
          setWallet(publicKey);
          const bal = await connection.getBalance(new PublicKey(publicKey));
          setBalance(bal / LAMPORTS_PER_SOL);
          setLoading(false);
        } catch (err) {
          console.error('Connection failed:', err);
          alert('Failed to connect wallet');
          setLoading(false);
        }
      };

      const disconnectWallet = async () => {
        try {
          if (window.phantom?.solana) await window.phantom.solana.disconnect();
          setWallet(null);
          setCurrentUser(null);
          setBalance(0);
          setActiveTab('home');
        } catch (err) {
          console.error('Disconnect failed:', err);
        }
      };

      const createPost = async () => {
        if (!newPost.trim() && !selectedMedia) {
          alert('Please add some content or media');
          return;
        }
        try {
          setLoading(true);
          setLoadingMessage('Creating post...');
          const solReward = (Math.random() * 0.05 + 0.01).toFixed(4);
          const post = {
            author_wallet: wallet,
            content: newPost,
            image_url: selectedMedia,
            media_type: mediaType,
            likes: [],
            comments: [],
            emojis: {},
            tips: 0,
            sol_reward: parseFloat(solReward)
          };
          await supabase.from('posts').insert([post]);
          await supabase.from('users').update({
            pending_sol: currentUser.pending_sol + parseFloat(solReward),
            total_earnings: currentUser.total_earnings + parseFloat(solReward)
          }).eq('wallet', wallet);
          setNewPost('');
          setSelectedMedia(null);
          setMediaType(null);
          await loadPosts();
          await loadUserData();
          setLoading(false);
          alert(`Post created! You earned ${solReward} SOL 🎉`);
        } catch (err) {
          console.error('Post creation error:', err);
          alert('Failed to create post');
          setLoading(false);
        }
      };

      const likePost = async (postId) => {
        if (!wallet) return;
        try {
          const post = allPosts.find(p => p.id === postId);
          const likes = post.likes || [];
          const liked = likes.includes(wallet);
          const newLikes = liked ? likes.filter(w => w !== wallet) : [...likes, wallet];
          await supabase.from('posts').update({ likes: newLikes }).eq('id', postId);
          await loadPosts();
        } catch (err) {
          console.error('Like error:', err);
        }
      };

      const addEmojiToPost = async (postId, emoji) => {
        if (!wallet) return;
        try {
          const post = allPosts.find(p => p.id === postId);
          const emojis = post.emojis || {};
          if (!emojis[emoji]) emojis[emoji] = [];
          if (emojis[emoji].includes(wallet)) {
            emojis[emoji] = emojis[emoji].filter(w => w !== wallet);
            if (emojis[emoji].length === 0) delete emojis[emoji];
          } else {
            emojis[emoji].push(wallet);
          }
          await supabase.from('posts').update({ emojis }).eq('id', postId);
          await loadPosts();
          setShowEmojiPicker(null);
        } catch (err) {
          console.error('Emoji error:', err);
        }
      };

      const addComment = async (postId) => {
        const comment = commentText[postId];
        if (!wallet || !comment?.trim()) return;
        try {
          const post = allPosts.find(p => p.id === postId);
          const comments = post.comments || [];
          const newComment = {
            id: Date.now(),
            author: wallet,
            content: comment,
            timestamp: new Date().toISOString()
          };
          comments.push(newComment);
          await supabase.from('posts').update({ comments }).eq('id', postId);
          setCommentText({ ...commentText, [postId]: '' });
          await loadPosts();
        } catch (err) {
          console.error('Comment error:', err);
        }
      };

      const tipPost = async (postId, amount) => {
        if (!wallet || !amount || amount <= 0) {
          alert('Please enter a valid amount');
          return;
        }
        const post = allPosts.find(p => p.id === postId);
        if (!post || post.author_wallet === wallet) {
          alert('Cannot tip your own post');
          return;
        }
        try {
          setLoading(true);
          setLoadingMessage('Processing gift...');
          const adminFee = amount * ADMIN_FEE_PERCENT;
          const recipientAmount = amount - adminFee;
          const transaction = new Transaction();
          transaction.add(
            SystemProgram.transfer({
              fromPubkey: new PublicKey(wallet),
              toPubkey: new PublicKey(post.author_wallet),
              lamports: Math.floor(recipientAmount * LAMPORTS_PER_SOL)
            })
          );
          transaction.add(
            SystemProgram.transfer({
              fromPubkey: new PublicKey(wallet),
              toPubkey: new PublicKey(ADMIN_WALLET),
              lamports: Math.floor(adminFee * LAMPORTS_PER_SOL)
            })
          );
          const { blockhash } = await connection.getLatestBlockhash();
          transaction.recentBlockhash = blockhash;
          transaction.feePayer = new PublicKey(wallet);
          const signed = await window.phantom.solana.signTransaction(transaction);
          const signature = await connection.sendRawTransaction(signed.serialize());
          await connection.confirmTransaction(signature);
          await supabase.from('posts').update({ tips: post.tips + amount }).eq('id', postId);
          const author = allUsers.find(u => u.wallet === post.author_wallet);
          if (author) {
            await supabase.from('users').update({
              pending_sol: author.pending_sol + recipientAmount,
              total_earnings: author.total_earnings + recipientAmount
            }).eq('wallet', post.author_wallet);
          }
          const bal = await connection.getBalance(new PublicKey(wallet));
          setBalance(bal / LAMPORTS_PER_SOL);
          await loadPosts();
          await loadAllUsers();
          setShowTipModal(false);
          setTipAmount('0.01');
          setTippingPostId(null);
          setLoading(false);
          alert(`Gift sent! Recipient gets ${recipientAmount.toFixed(4)} SOL ✅`);
        } catch (err) {
          console.error('Tip failed:', err);
          alert('Gift cancelled or failed');
          setLoading(false);
        }
      };

      const withdrawSOL = async () => {
        if (!currentUser || currentUser.pending_sol <= 0) {
          alert('No SOL available to withdraw');
          return;
        }
        try {
          setLoading(true);
          setLoadingMessage('Processing withdrawal...');
          await supabase.from('users').update({ pending_sol: 0 }).eq('wallet', wallet);
          const updatedUser = { ...currentUser, pending_sol: 0 };
          setCurrentUser(updatedUser);
          const bal = await connection.getBalance(new PublicKey(wallet));
          setBalance(bal / LAMPORTS_PER_SOL);
          await loadUserData();
          setLoading(false);
          alert('Withdrawal successful! ✅');
        } catch (err) {
          console.error('Withdrawal failed:', err);
          alert('Withdrawal failed');
          setLoading(false);
        }
      };

      const updateProfile = async () => {
        if (!editUsername.trim()) {
          alert('Username cannot be empty');
          return;
        }
        try {
          setLoading(true);
          setLoadingMessage('Updating profile...');
          const updates = {
            username: editUsername,
            bio: editBio,
            profile_pic: editPfp
          };
          await supabase.from('users').update(updates).eq('wallet', wallet);
          setCurrentUser({ ...currentUser, ...updates });
          setEditingProfile(false);
          await loadAllUsers();
          setLoading(false);
          alert('Profile updated!');
        } catch (err) {
          console.error('Profile update error:', err);
          setLoading(false);
          alert('Failed to update profile');
        }
      };

      const toggleFollow = async (targetWallet) => {
        if (!wallet || wallet === targetWallet) return;
        try {
          const { data: existing } = await supabase.from('follows').select('*').eq('follower_wallet', wallet).eq('following_wallet', targetWallet).maybeSingle();
          if (existing) {
            await supabase.from('follows').delete().eq('id', existing.id);
          } else {
            await supabase.from('follows').insert([{
              follower_wallet: wallet,
              following_wallet: targetWallet
            }]);
          }
          await loadFollows();
        } catch (err) {
          console.error('Follow error:', err);
        }
      };

      const sendMessage = async () => {
        if (!newMessage.trim() || !chatWith) return;
        try {
          await supabase.from('messages').insert([{
            from_wallet: wallet,
            to_wallet: chatWith,
            content: newMessage
          }]);
          setNewMessage('');
          await loadChatMessages();
        } catch (err) {
          console.error('Message send error:', err);
        }
      };

      const markNotificationsRead = async () => {
        try {
          await supabase.from('notifications').update({ read: true }).eq('user_wallet', wallet).eq('read', false);
          await loadNotifications();
        } catch (err) {
          console.error('Mark read error:', err);
        }
      };

      const updateSiteSettings = async () => {
        if (!newCAText || newCAText.length > 70) {
          alert('CA text must be 1-70 characters');
          return;
        }
        try {
          setLoading(true);
          setLoadingMessage('Updating settings...');
          const { data: existing } = await supabase.from('site_settings').select('*').limit(1).maybeSingle();
          if (existing) {
            await supabase.from('site_settings').update({
              twitter_link: newTwitterLink,
              ca_text: newCAText
            }).eq('id', existing.id);
          } else {
            await supabase.from('site_settings').insert([{
              twitter_link: newTwitterLink,
              ca_text: newCAText
            }]);
          }
          await loadSiteSettings();
          setEditingSettings(false);
          setLoading(false);
          alert('Settings updated!');
        } catch (err) {
          console.error('Settings update error:', err);
          setLoading(false);
          alert('Failed to update settings');
        }
      };

      const handleMediaUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) {
          alert('File too large. Maximum 10MB.');
          return;
        }
        try {
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64 = reader.result;
            setSelectedMedia(base64);
            if (file.type.startsWith('image')) setMediaType('image');
            else if (file.type.startsWith('video')) setMediaType('video');
          };
          reader.readAsDataURL(file);
        } catch (err) {
          console.error('Upload error:', err);
          alert('Upload failed');
        }
      };

      const selectGif = (gifUrl) => {
        setSelectedMedia(gifUrl);
        setMediaType('gif');
        setShowGifPicker(false);
      };

      const getUserFollowers = (userWallet) => {
        return allFollows.filter(f => f.following_wallet === userWallet).length;
      };

      const getUserFollowing = (userWallet) => {
        return allFollows.filter(f => f.follower_wallet === userWallet).length;
      };

      const isFollowing = (targetWallet) => {
        return allFollows.some(f => f.follower_wallet === wallet && f.following_wallet === targetWallet);
      };

      const renderPost = (post) => {
        const author = allUsers.find(u => u.wallet === post.author_wallet);
        if (!author) return null;
        const isLiked = wallet && post.likes?.includes(wallet);
        const isOwner = wallet === post.author_wallet;
        const comments = post.comments || [];
        const postEmojis = post.emojis || {};

        return (
          <div key={post.id} style={styles.post}>
            <div style={styles.postHeader}>
              <div style={styles.postAuthor} onClick={() => setViewingProfile(post.author_wallet)}>
                <div style={styles.profilePicSmall}>{author.profile_pic}</div>
                <div>
                  <div style={styles.authorName}>{author.username}</div>
                  <div style={styles.postTime}>{new Date(post.created_at).toLocaleString()}</div>
                </div>
              </div>
              <div style={styles.postEarnings}>+{post.sol_reward} SOL</div>
            </div>
            <div style={styles.postContent}>{post.content}</div>
            {post.image_url && (
              <div style={styles.mediaContainer}>
                {post.media_type === 'video' ? (
                  <video src={post.image_url} style={styles.postMedia} controls />
                ) : (
                  <img src={post.image_url} style={styles.postMedia} alt="post" />
                )}
              </div>
            )}
            <div style={styles.postActions}>
              <button style={{...styles.actionBtn, ...(isLiked ? styles.actionBtnLiked : {})}} onClick={() => likePost(post.id)}>
                ❤️ {post.likes?.length || 0}
              </button>
              <button style={styles.actionBtn} onClick={() => setShowComments({ ...showComments, [post.id]: !showComments[post.id] })}>
                💬 {comments.length}
              </button>
              <button style={styles.actionBtn} onClick={() => setShowEmojiPicker(showEmojiPicker === post.id ? null : post.id)}>
                😊
              </button>
              {!isOwner && wallet && (
                <button style={{...styles.actionBtn, ...styles.tipBtn}} onClick={() => { setTippingPostId(post.id); setShowTipModal(true); }}>
                  💰 Gift
                </button>
              )}
              {post.tips > 0 && (
                <span style={styles.tips}>🎁 {post.tips.toFixed(4)} SOL</span>
              )}
            </div>
            {Object.keys(postEmojis).length > 0 && (
              <div style={styles.emojiReactions}>
                {Object.entries(postEmojis).map(([emoji, users]) => (
                  <span key={emoji} style={{...styles.emojiReaction, ...(users.includes(wallet) ? styles.emojiReactionActive : {})}} onClick={() => addEmojiToPost(post.id, emoji)}>
                    {emoji} {users.length}
                  </span>
                ))}
              </div>
            )}
            {showEmojiPicker === post.id && (
              <div className="emoji-picker">
                {emojis.map(emoji => (
                  <span key={emoji} onClick={() => addEmojiToPost(post.id, emoji)}>{emoji}</span>
                ))}

                </div>
              </div>

      if (!wallet) {
        return (
          <div style={{...styles.app, ...styles.appDark}}>
            {loading && (
              <div className="loading">
                <div className="spinner"></div>
                <p style={{color: '#fff'}}>{loadingMessage}</p>
              </div>

            <div style={styles.connectScreen}>
              <div style={styles.connectBox}>

                  <span style={styles.logoIconLarge}>💎</span>
                  <h1 style={styles.connectTitle}>EarnBook</h1>
                </div>
                <p style={styles.tagline}>Post memes. Earn instantly.</p>
                <p style={styles.description}>Connect your Phantom wallet to start earning SOL</p>
                <button style={styles.btnConnect} onClick={connectWallet}>
                  🔗 Connect Wallet
                </button>
              </div>
            </div>
          </div>

      const isAdmin = wallet === ADMIN_WALLET;
      const unreadNotifs = notifications.filter(n => !n.read).length;

      return (
        <div style={{...styles.app, ...(theme === 'dark' ? styles.appDark : styles.appLight)}}>

                <span style={styles.logoText}>EarnBook</span>
              </div>
              <div style={styles.headerRight}>
                <div style={styles.balanceDisplay}>

                <button style={styles.iconBtn} onClick={() => { setActiveTab('settings'); setViewingProfile(null); setChatWith(null); }}>⚙️</button>

          <div style={styles.mainContent}>

                        <div style={styles.messageTime}>{new Date(msg.created_at).toLocaleTimeString()}</div>

                <div style={styles.chatInputContainer}>
                  <input value={newMessage} onChange={(e) => setNewMessage(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && sendMessage()} placeholder="Type a message..." style={styles.chatInput} />

              <div>

                  const isOwnProfile = viewingProfile === wallet;
                  const userPosts = allPosts.filter(p => p.author_wallet === viewingProfile);
                  const followers = getUserFollowers(viewingProfile);
                  const following = getUserFollowing(viewingProfile);
                  return (
                    <div style={styles.profile}>
                      <div style={styles.profilePicLarge}>{user.profile_pic}</div>
                      <h2 style={styles.h2}>{user.username}</h2>
                      <p style={styles.bio}>{user.bio}</p>
                      <p style={styles.walletText}>{user.wallet}</p>
                      <div style={styles.stats}>

                          <div style={styles.statLabel}>Posts</div>
                        </div>
                        <div style={styles.statItem}>
                          <div style={styles.statValue}>{followers}</div>
                          <div style={styles.statLabel}>Followers</div>
                        </div>
                        <div style={styles.statItem}>
                          <div style={styles.statValue}>{following}</div>
                          <div style={styles.statLabel}>Following</div>
                        </div>
                        <div style={styles.statItem}>
                          <div style={styles.statValue}>{user.total_earnings.toFixed(3)}</div>

                        </div>

                      {isOwnProfile ? (
                        <div style={styles.profileActions}>

                              <span>💎 Available:</span>
                              <span style={styles.earningsValue}>{user.pending_sol.toFixed(4)} SOL</span>
                            </div>
                            <div style={styles.earningsRow}>
                              <span>🏆 Total Earned:</span>
                              <span style={styles.earningsValue}>{user.total_earnings.toFixed(4)} SOL</span>
                            </div>
                          </div>
                          <button style={styles.btnPrimary} onClick={() => { setEditingProfile(true); setEditUsername(user.username); setEditBio(user.bio); setEditPfp(user.profile_pic); }}>

                </div>
                <h3 style={styles.sectionTitle}>Site Configuration</h3>
                {editingSettings ? (
                  <div>
                    <div style={styles.formGroup}>
                      <label>Twitter Link</label>
                      <input type="url" placeholder="https://twitter.com/..." value={newTwitterLink} onChange={(e) => setNewTwitterLink(e.target.value)} style={styles.input} />
                    </div>
                    <div style={styles.formGroup}>
                      <label>CA Text (max 70 chars)</label>
                      <input type="text" placeholder="Contract Address..." value={newCAText} onChange={(e) => setNewCAText(e.target.value.slice(0, 70))} style={styles.input} maxLength={70} />

                    </div>
                    <div style={styles.buttonGroup}>
                      <button style={styles.btnPrimary} onClick={updateSiteSettings}>💾 Save</button>
                      <button style={styles.btnSecondary} onClick={() => setEditingSettings(false)}>Cancel</button>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div style={styles.infoRow}>
                      <span>Twitter:</span>
                      <span style={styles.infoValue}>{siteSettings.twitter_link || 'Not set'}</span>
                    </div>
                    <div style={styles.infoRow}>
                      <span>CA:</span>
                      <span style={styles.infoValue}>{siteSettings.ca_text || 'Not set'}</span>
                    </div>
                    <button style={styles.btnPrimary} onClick={() => { setEditingSettings(true); setNewTwitterLink(siteSettings.twitter_link || ''); setNewCAText(siteSettings.ca_text || ''); }}>
                      ✏️ Edit Settings
                    </button>
                  </div>
                )}
              </div>
            ) : null}
          </div>

          {showNotifications && (
            <div style={styles.notificationsPanel}>
              <div style={styles.notifHeader}>
                <h3>🔔 Notifications</h3>
                <button style={styles.closeBtn} onClick={() => setShowNotifications(false)}>✕</button>
              </div>
              <div style={styles.notifList}>
                {notifications.length === 0 ? (
                  <div style={styles.emptyState}>No notifications</div>
                ) : (
                  notifications.map(notif => (
                    <div key={notif.id} style={{...styles.notifItem, ...(notif.read ? {} : styles.notifItemUnread)}}>
                      <div style={styles.notifMessage}>{notif.message}</div>
                      <div style={styles.notifTime}>{new Date(notif.created_at).toLocaleString()}</div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {showSearchModal && (
            <div style={styles.modalOverlay} onClick={() => setShowSearchModal(false)}>
              <div style={styles.searchModal} onClick={(e) => e.stopPropagation()}>
                <div style={styles.modalHeader}>
                  <h3>🔍 Search</h3>
                  <button style={styles.closeBtn} onClick={() => setShowSearchModal(false)}>✕</button>
                </div>
                <input type="text" placeholder="Search users, posts..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={styles.searchInput} autoFocus />
                {searchQuery && (
                  <div style={styles.searchResults}>
                    {allUsers.filter(u => u.username.toLowerCase().includes(searchQuery.toLowerCase()) || u.wallet.toLowerCase().includes(searchQuery.toLowerCase())).length > 0 && (
                      <div>
                        <h4 style={styles.searchTitle}>Users</h4>
                        {allUsers.filter(u => u.username.toLowerCase().includes(searchQuery.toLowerCase()) || u.wallet.toLowerCase().includes(searchQuery.toLowerCase())).map(user => (
                          <div key={user.wallet} style={styles.searchItem} onClick={() => { setViewingProfile(user.wallet); setShowSearchModal(false); setSearchQuery(''); }}>
                            <div style={styles.profilePicSmall}>{user.profile_pic}</div>
                            <div>
                              <div style={styles.userName}>{user.username}</div>
                              <div style={styles.userWallet}>{user.wallet.slice(0, 16)}...</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {showTipModal && (
            <div style={styles.modalOverlay} onClick={() => setShowTipModal(false)}>
              <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
                <h3 style={styles.h2}>💰 Gift SOL</h3>
                <p style={styles.modalText}>Enter amount:</p>
                <input type="number" step="0.001" min="0.001" value={tipAmount} onChange={(e) => setTipAmount(e.target.value)} style={styles.tipInput} placeholder="0.01" />
                <p style={styles.feeNote}>
                  Admin fee (0.5%): {(parseFloat(tipAmount || 0) * ADMIN_FEE_PERCENT).toFixed(4)} SOL<br/>
                  Recipient gets: {(parseFloat(tipAmount || 0) * (1 - ADMIN_FEE_PERCENT)).toFixed(4)} SOL
                </p>
                <div style={styles.buttonGroup}>
                  <button style={styles.btnPrimary} onClick={() => tipPost(tippingPostId, parseFloat(tipAmount))}>🎁 Send</button>
                  <button style={styles.btnSecondary} onClick={() => { setShowTipModal(false); setTipAmount('0.01'); setTippingPostId(null); }}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          {showChatList && (
            <div style={styles.modalOverlay} onClick={() => setShowChatList(false)}>
              <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
                <div style={styles.modalHeader}>
                  <h3>💬 Start Chat</h3>
                  <button style={styles.closeBtn} onClick={() => setShowChatList(false)}>✕</button>
                </div>
                <div style={styles.chatList}>
                  {allUsers.filter(u => u.wallet !== wallet).length === 0 ? (
                    <div style={styles.emptyState}>No other users</div>

                    allUsers.filter(u => u.wallet !== wallet).map(user => (
                      <div key={user.wallet} style={styles.chatListItem} onClick={() => { setChatWith(user.wallet); setShowChatList(false); }}>

                          <div style={styles.userName}>{user.username}</div>

              </div>

          <div style={{...styles.bottomNav, ...(theme === 'dark' ? styles.bottomNavDark : styles.bottomNavLight)}}>
            <button style={{...styles.navBtn, ...(activeTab === 'home' && !chatWith && !viewingProfile ? styles.navBtnActive : {})}} onClick={() => { setActiveTab('home'); setViewingProfile(null); setChatWith(null); }}>
              <span style={styles.navIcon}>🏠</span>
              <span style={styles.navLabel}>Home</span>
            </button>
            <button style={styles.navBtn} onClick={() => setShowSearchModal(true)}>
              <span style={styles.navIcon}>🔍</span>
              <span style={styles.navLabel}>Search</span>
            </button>
            <button style={{...styles.navBtn, ...(viewingProfile === wallet && !editingProfile ? styles.navBtnActive : {})}} onClick={() => { setViewingProfile(wallet); setActiveTab('profile'); setChatWith(null); }}>

              <span style={styles.navLabel}>Profile</span>

              <span style={styles.navIcon}>💬</span>
              <span style={styles.navLabel}>Chat</span>
            </button>
            {isAdmin && (
              <button style={{...styles.navBtn, ...(activeTab === 'admin' ? styles.navBtnActive : {})}} onClick={() => { setActiveTab('admin'); setViewingProfile(null); setChatWith(null); }}>
                <span style={styles.navIcon}>🔐</span>
                <span style={styles.navLabel}>Admin</span>
              </button>

          <div style={{...styles.footer, ...(theme === 'dark' ? styles.footerDark : styles.footerLight)}}>

            )}
            {siteSettings.ca_text && (
              <div style={styles.caText}>CA: {siteSettings.ca_text}</div>
            )}
          </div>
        </div>
      );
    }

    const styles = {
      app: { minHeight: '100vh', fontFamily: '-apple-system, sans-serif', paddingBottom: '140px' },
      appDark: { background: 'linear-gradient(135deg, #0f0e13 0%, #1a1625 100%)', color: '#e0e0e0' },
      appLight: { background: 'linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%)', color: '#333' },
      connectScreen: { display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', padding: '2rem' },
      connectBox: { background: 'rgba(255,255,255,0.05)', padding: '3rem', borderRadius: '30px', textAlign: 'center', maxWidth: '500px', backdropFilter: 'blur(20px)', border: '1px solid rgba(255,255,255,0.1)', boxShadow: '0 20px 60px rgba(0,0,0,0.3)' },
      connectLogo: { marginBottom: '2rem' },
      logoIconLarge: { fontSize: '5rem', display: 'block', marginBottom: '1rem' },
      connectTitle: { fontSize: '3.5rem', background: 'linear-gradient(135deg, #14F195 0%, #9945FF 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', fontWeight: 800, letterSpacing: '-2px', margin: 0 },

      description: { opacity: 0.8, marginBottom: '2.5rem', fontSize: '1.1rem', lineHeight: 1.6 },
      btnConnect: { background: 'linear-gradient(90deg, #14F195, #9945FF)', color: 'white', border: 'none', padding: '1.2rem 3rem', borderRadius: '16px', fontSize: '1.3rem', cursor: 'pointer', fontWeight: 700, width: '100%' },

      logoText: { fontSize: '1.5rem', fontWeight: 800, background: 'linear-gradient(135deg, #14F195 0%, #9945FF 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', letterSpacing: '-1px' },
      headerRight: { display: 'flex', gap: '1rem', alignItems: 'center' },
      balanceDisplay: { display: 'flex', flexDirection: 'column', alignItems: 'flex-end' },
      balanceLabel: { fontSize: '0.7rem', opacity: 0.6, textTransform: 'uppercase' },
